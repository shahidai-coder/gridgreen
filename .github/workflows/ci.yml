name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux: 3.15 = latest stable (primary), 3.12 = declared minimum.
        # Windows: 3.14, because PyYAML (via Jupyter) has no Windows wheel for 3.15.
        include:
          - { os: ubuntu-latest, python: "3.15" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.14" }
    env:
      # Overrides .python-version for every uv command, so each job really uses its matrix Python.
      # Without this, `uv run` re-creates the environment with the pinned version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Confirm interpreter version
        run: uv run python -c "import sys; print(sys.version); assert sys.version.startswith('${{ matrix.python }}')"
      - name: Pytest
        run: uv run pytest -q
      - name: Execute notebook against synthetic demo data (smoke test only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.15'
        run: |
          uv run python scripts/build_demo_db.py
          GRIDGREEN_DB_PATH=data/demo/gridgreen_demo.duckdb uv run jupyter nbconvert \
            --to notebook --execute notebooks/gridgreen_eda.ipynb --output /tmp/executed.ipynb
