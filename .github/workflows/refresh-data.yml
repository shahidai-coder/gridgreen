# Opt-in: fetch new NESO data and commit the updated DuckDB snapshot that the
# deployed dashboard reads. Each run also stores a 48-hour forecast snapshot,
# which is what makes forecast-horizon analysis possible over time.
# Trade-off: every run commits a binary file, which grows git history. Enable
# the schedule only if you accept that (or move the snapshot to object storage).
name: Refresh data

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "15 */6 * * *"   # every 6 hours

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv python install 3.15
      - run: uv sync --locked --no-dev
      - name: Run pipeline (incremental)
        run: uv run python scripts/run_pipeline.py --db data/gridgreen.duckdb
      - name: Commit updated database
        run: |
          git config user.name "gridgreen-bot"
          git config user.email "gridgreen-bot@users.noreply.github.com"
          git add -f data/gridgreen.duckdb
          git diff --cached --quiet || git commit -m "data: refresh NESO snapshot"
          git push
