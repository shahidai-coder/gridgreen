[theme]
# Must match EMERALD / CANVAS / SURFACE / TEXT in src/gridgreen/ui/theme.py (checked by tests/test_theme.py).
base = "light"
primaryColor = "#477510"
backgroundColor = "#EDEFEA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E231F"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
