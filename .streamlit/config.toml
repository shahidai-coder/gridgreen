[theme]
# Must match EMERALD / CANVAS / SURFACE / TEXT in src/gridgreen/ui/theme.py (checked by tests/test_theme.py).
base = "light"
primaryColor = "#2563C9"
backgroundColor = "#F3F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16213A"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
