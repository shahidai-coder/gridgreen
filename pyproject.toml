[project]
name = "gridgreen"
version = "1.0.0"
description = "When is Britain's electricity cleanest, and what makes it that way? An ETL + EDA project on the NESO Carbon Intensity API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=2.0",
    "httpx>=0.28",
    "numpy>=2.5",
    "pandas>=3.1",
    "plotly>=7.1",
    "pyarrow>=26.0",
    "pydantic>=2.14",
    "streamlit>=1.66",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "jupyter>=1.1",
    "nbclient>=0.11",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridgreen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["live: hits the real NESO API (deselected by default in CI)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY", "RUF"]
ignore = ["PD008", "PD010", "PD101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"pages/*" = ["E501"]
# Embedded notebook cell source: long lines are cell text, not module code.
"scripts/build_notebook.py" = ["E501"]
# Embedded CSS/JS in string literals.
"src/gridgreen/ui/animated.py" = ["E501"]
"src/gridgreen/ui/theme.py" = ["E501"]
"src/gridgreen/ui/banners.py" = ["E501"]
