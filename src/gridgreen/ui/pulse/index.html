<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridGreen overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="echarts.min.js"></script>
<style>
  /* Colours are injected from theme.py at render time (applyTheme); these are only fallbacks. */
  :root { --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#EEF3FB; --border:#E1E7F0; --text:#16213A; --text2:#55627A;
          --accent:#2563C9; --accent2:#6D4FC2; --on-accent:#FFFFFF; --low-bg:#DCE9FB; --low-text:#1D4E9E;
          --yellow:#FFF1C9; --yellow-text:#5B4710; --error:#C9473F; --selected:#E2ECFB; --high-bg:#FDEEEE; --high-text:#8A2E2E;
          --shadow: 0 1px 2px rgba(22,33,58,.04), 0 10px 28px rgba(22,33,58,.07);
          --font: Poppins, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  .page { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; padding: 2px 2px 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow);
          opacity: 0; transform: translateY(10px); animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; min-width: 0;
          transition: box-shadow .25s ease; }
  .card:hover { box-shadow: 0 2px 4px rgba(22,33,58,.05), 0 16px 36px rgba(22,33,58,.10); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; }
  .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; margin-bottom: 8px; }
  .head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .head p { margin: 2px 0 0; color: var(--text2); font-size: 12.5px; }
  .seg { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { font: 500 12.5px/1 var(--font); color: var(--text2); background: transparent; border: 0; border-radius: 999px;
                padding: 8px 13px; cursor: pointer; transition: background .15s ease, color .15s ease, box-shadow .15s ease; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(22,33,58,.12); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chart { width: 100%; }

  .greet { grid-column: span 12; padding: 4px 4px 0; }
  .greet h1 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .greet p { margin: 4px 0 0; color: var(--text2); font-size: 14.5px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
          background: var(--low-bg); color: var(--low-text); text-transform: capitalize; }
  .pill.demo { background: var(--high-bg); color: var(--high-text); text-transform: none; margin-left: 8px; }
  /* The band pill carries meaning: green only for low-carbon bands. */
  .pill.moderate { background: var(--yellow); color: var(--yellow-text); }
  .pill.high { background: var(--high-bg); color: var(--high-text); }

  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 12px; align-items: center; overflow: hidden; }
  .hero .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hero .label { font-weight: 600; font-size: 15px; }
  .hero .big { font-size: clamp(46px, 6.4vw, 66px); font-weight: 700; line-height: 1; letter-spacing: -0.03em; margin: 12px 0 6px; font-variant-numeric: tabular-nums; }
  .hero .big small { font-size: 16px; font-weight: 500; color: var(--text2); letter-spacing: 0; margin-left: 8px; }
  .delta { font-weight: 600; font-size: 13.5px; } .delta.down { color: var(--accent); } .delta.up { color: var(--error); }
  .delta span { color: var(--text2); font-weight: 400; }
  .when { color: var(--text2); font-size: 12.5px; margin-top: 2px; }
  #heroSpark { height: 150px; }
  .scene { width: 100%; height: auto; display: block; border-radius: 18px; }

  /* "A day on the grid": a continuously looping, data-linked illustration */
  .daycycle { padding: 0; position: relative; overflow: hidden; }
  .daycycle svg { display: block; width: 100%; height: clamp(210px, 28vw, 290px); }
  .dc-read { position: absolute; top: 14px; left: 14px; background: color-mix(in srgb, var(--surface) 88%, transparent);

  .dc-read .k { color: var(--text2); font-size: 11.5px; }
  .dc-read .t { font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .dc-read .v { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dc-read .v i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--surface) 60%, transparent); }
  .dc-bar { position: relative; height: 6px; border-radius: 999px; margin-top: 8px; }
  .dc-bar b { position: absolute; top: -3px; width: 4px; height: 12px; border-radius: 2px; background: var(--text); transform: translateX(-2px); }
  .dc-play { position: absolute; top: 14px; right: 14px; font: 600 12.5px/1 var(--font); color: var(--text); cursor: pointer;

  .dc-play:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 560px) { .dc-read { min-width: 0; padding: 8px 10px; } .dc-read .t { font-size: 19px; } }
  .tip { background: var(--yellow); border-color: transparent; color: var(--yellow-text); display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .tip .leaf { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.7); display: grid; place-items: center; }
  .tip h3 { font-size: 23px; line-height: 1.2; font-weight: 700; margin: 0; color: var(--yellow-text); }
  .tip p { margin: 0; font-size: 13.5px; color: var(--yellow-text); }

  .kpi .k-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi .k-value small { font-size: 12.5px; font-weight: 500; color: var(--text2); margin-left: 4px; letter-spacing: 0; }
  .kpi .k-label { color: var(--text); font-size: 13px; font-weight: 500; }
  .kpi .k-sub { color: var(--text2); font-size: 11.5px; }
  .kpi .spark { height: 40px; margin-top: 8px; }

  .mixwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 8px; align-items: center; }
  .mixlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .mixlist li { display: grid; grid-template-columns: 12px 70px 1fr 48px; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; transition: background .15s ease; }
  .mixlist li:hover, .mixlist li.on { background: var(--surface2); }
  .mixlist .dot { width: 10px; height: 10px; border-radius: 50%; }
  .mixlist .name { text-transform: capitalize; font-size: 13px; }
  .mixlist .bar { height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
  .mixlist .bar i { display: block; height: 100%; border-radius: 999px; width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
  .mixlist .pct { text-align: right; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }

  .daytitle { font-size: 17px; font-weight: 600; margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .stat { background: var(--surface2); border-radius: 14px; padding: 8px 12px; min-width: 92px; }
  .stat b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text2); font-size: 11.5px; }
  .daygrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 8px; align-items: center; }

  .insights { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .insights li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 18px; background: var(--surface2); transition: transform .2s ease; }
  .insights li:hover { transform: translateY(-2px); }
  .insights .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--accent); }
  .insights b { display: block; font-weight: 600; font-size: 14px; }
  .insights span { color: var(--text2); font-size: 12.5px; }
  .note { color: var(--text2); font-size: 12px; margin: 6px 0 0; }
  .empty { padding: 40px; text-align: center; color: var(--text2); }

  @media (max-width: 960px) { .daygrid { grid-template-columns: 1fr; } }
  @media (max-width: 820px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } .s3 { grid-column: span 6; }
    .daygrid { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
  @media (max-width: 560px) { .s3 { grid-column: span 12; } .hero, .mixwrap, .daygrid { grid-template-columns: 1fr; } .card { padding: 16px; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; transform: none; } .mixlist .bar i { transition: none; } }
</style>

<script>

    tooltip: { backgroundColor: T.surface, borderColor: T.border, borderWidth: 1, padding: [8, 12], textStyle: { color: T.text, fontFamily: T.font, fontSize: 12.5 },

  axisLabel: { color: T.text2, fontSize: 11 }, splitLine: { lineStyle: { color: T.grid } } });

  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {

const ICONS = {
  clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  plug: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/></svg>',

  wind: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>',
};
const LEAF = () => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z" fill="${T.lowBg}" stroke="${T.accent}" stroke-width="1.4"/><path d="M5 19l8-8" stroke="${T.accent}" stroke-width="1.8" stroke-linecap="round"/></svg>`;

/* ---------- "A day on the grid" ----------
   24 hours pass in about 24 seconds. Every colour blends between the light and dark scene palettes with the
   height of the sun. The energy flowing along the power line takes the colour of the period's real average

const hexMix = (a, b, t) => "#" + [1, 3, 5].map((i) => {
  const x = parseInt(a.slice(i, i + 2), 16), y = parseInt(b.slice(i, i + 2), 16);
  return Math.round(x + (y - x) * t).toString(16).padStart(2, "0"); }).join("");

    <g>${[[60, 226], [700, 236], [980, 232]].map(([x, y]) => `<rect class="dc-trunk" x="${x - 1.5}" y="${y - 6}" width="3" height="12"/><circle class="dc-tree" cx="${x}" cy="${y - 12}" r="10"/>`).join("")}</g>`;

  const q = (sel) => svg.querySelectorAll(sel), sun = svg.querySelector("#dcSun"), halo = svg.querySelector("#dcHalo");

  const bar = document.getElementById("dcBar");
  bar.style.background = `linear-gradient(90deg, ${clock.map((v, i) => `${v === null ? T.border : scaleColor(v, lo, hi)} ${(i / 47 * 100).toFixed(1)}%`).join(", ")})`;

    `<div class="stat"><b>${fmt(mean)}</b><span>day mean</span></div>` +
    `<div class="stat"><b style="color:${T.scale[0]}">${fmt(mn[0])}</b><span>low at ${slotLabel(mn[1])}</span></div>` +
    `<div class="stat"><b style="color:${T.scale[4]}">${fmt(mx[0])}</b><span>high at ${slotLabel(mx[1])}</span></div>`;
  const b = day.best2h;
  document.getElementById("dayNote").textContent = b === null || b === undefined ? "No complete 2-hour window on this day."
    : `Cleanest 2 hours this day: ${slotLabel(b)} to ${slotLabel((b + 4) % 48)} (highlighted). Times are UK wall-clock.`;
  const allVals = Object.values(D.days).flatMap((x) => x.slots).filter((v) => v !== null);
  chart("dayLine").setOption({ ...base(), grid: { left: 36, right: 8, top: 12, bottom: 24 },
    tooltip: { ...base().tooltip, trigger: "axis", formatter: (ps) => `${ps[0].axisValue}: <b>${fmt(ps[0].data)}</b> gCO₂/kWh` },
    xAxis: { type: "category", data: SLOTS, boundaryGap: false, ...axisCommon(), splitLine: { show: false }, axisLabel: { color: T.text2, fontSize: 10, interval: 11 } },
    yAxis: { type: "value", ...axisCommon(), min: (v) => Math.max(0, Math.floor(v.min * 0.9)) },
    visualMap: { show: false, seriesIndex: 0, dimension: 1, min: Math.min(...allVals), max: Math.max(...allVals), inRange: { color: T.scale } },
    series: [{ type: "line", data: s, smooth: 0.3, showSymbol: false, connectNulls: false, lineStyle: { width: 3 },
      areaStyle: { opacity: 0.12 },
      markArea: b === null || b === undefined ? undefined : { silent: true, itemStyle: { color: T.accent + "18", borderColor: T.accent, borderWidth: 1, borderType: "dashed" },
        data: [[{ xAxis: SLOTS[b] }, { xAxis: SLOTS[Math.min(b + 4, 47)] }]] } }] }, { notMerge: true });
  const mix = Object.entries(day.mix).sort((a, b2) => b2[1] - a[1]);
  chart("dayMix").setOption({ ...base(), tooltip: { ...base().tooltip, formatter: (p) => `${p.name}: <b>${fmt(p.value, 1)}%</b>` },
    series: [{ type: "pie", radius: ["52%", "80%"], center: ["50%", "50%"], padAngle: 2, itemStyle: { borderRadius: 4 }, avoidLabelOverlap: false,
      label: { show: true, position: "center", formatter: () => mix.length ? `{a|${mix[0][0]}}\n{b|${fmt(mix[0][1], 0)}%}` : "", rich: {
        a: { color: T.text2, fontSize: 11, fontFamily: T.font, textTransform: "capitalize" }, b: { color: T.text, fontSize: 18, fontWeight: 700, fontFamily: T.font } } },
      emphasis: { label: { show: true, formatter: (p) => `{a|${p.name}}\n{b|${fmt(p.value, 0)}%}` } }, labelLine: { show: false },
      data: mix.map(([f, v]) => ({ name: f, value: v, itemStyle: { color: T.fuels[f] || T.text2 } })) }] }, { notMerge: true });
}
function drawClock() {
  const vals = D.clocks[state.clock], ok = vals.filter((v) => v !== null);
  const lo = Math.min(...ok), hi = Math.max(...ok), best = vals.indexOf(lo), avg = ok.reduce((a, b) => a + b, 0) / ok.length;
  chart("clock").setOption({ ...base(),
    tooltip: { ...base().tooltip, formatter: (p) => `${SLOTS[p.dataIndex]}: <b>${fmt(p.value)}</b> gCO₂/kWh` },
    polar: { radius: ["34%", "86%"], center: ["50%", "52%"] },
    angleAxis: { type: "category", data: SLOTS, startAngle: 90, clockwise: true, axisLine: { lineStyle: { color: T.border } }, axisTick: { show: false },
      axisLabel: { color: T.text2, fontSize: 11, interval: 5 }, splitLine: { show: false } },
    radiusAxis: { min: 0, max: Math.ceil(hi * 1.02), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { show: false },
      splitLine: { lineStyle: { color: T.grid } } },
    visualMap: { show: false, min: lo, max: hi, inRange: { color: T.scale }, dimension: 0 },
    title: { text: SLOTS[best], subtext: `cleanest\n${fmt(lo)} g on average`, left: "center", top: "43%", itemGap: 2,
      textStyle: { color: T.text, fontSize: 20, fontWeight: 700, fontFamily: T.font },
      subtextStyle: { color: T.text2, fontSize: 11.5, fontFamily: T.font, lineHeight: 15, align: "center" } },
    series: [{ type: "bar", coordinateSystem: "polar", data: vals, barCategoryGap: "14%", itemStyle: { borderRadius: 4 },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: "rgba(22,33,58,.25)" } },
      animationDelay: (i) => (REDUCE ? 0 : i * 12) }] }, { notMerge: true });
}
function drawSankey() {
  const s = D.sankey, sub = document.getElementById("sankeySub");
  if (!s) { sub.textContent = "No pipeline run with extracted records is recorded yet."; return; }
  sub.textContent = `Intensity records in the latest data run (${s.started}, ${s.status}). Re-runs show up as updates, never duplicates.`;
  const color = { "Fetched from API": T.accent2, "Passed validation": T.accent, "Rejected and logged": T.error, "Exact duplicates": T.warn,
    "Loaded to DuckDB": T.accent, "New half-hours": T.fuels.hydro, "Updated existing": T.scale[1], "Outside range or merged": T.text2 };
  chart("sankey").setOption({ ...base(), tooltip: { ...base().tooltip, formatter: (p) => p.dataType === "edge"
      ? `${p.data.source} → ${p.data.target}: <b>${fmt(p.data.value)}</b>` : `${p.name}: <b>${fmt(p.value)}</b>` },
    series: [{ type: "sankey", left: 6, right: 190, top: 10, bottom: 10, nodeWidth: 14, nodeGap: 18, draggable: true, layoutIterations: 32,
      emphasis: { focus: "adjacency" }, lineStyle: { color: "gradient", curveness: 0.5, opacity: 0.28 },
      label: { color: T.text, fontFamily: T.font, fontSize: 12.5, formatter: (p) => `${p.name}  {v|${fmt(p.value)}}`, rich: { v: { color: T.text2, fontSize: 12 } } },
      data: s.nodes.map((n) => ({ ...n, itemStyle: { color: color[n.name] || T.text2, borderWidth: 0 } })), links: s.links }] });
}
