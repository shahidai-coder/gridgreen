<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridGreen overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="echarts.min.js"></script>
<style>
  /* Colours are injected from theme.py at render time (applyTheme); these are only fallbacks. */
  :root { --bg:#EDEFEA; --surface:#FFFFFF; --surface2:#F2F4EF; --border:#E1E5DC; --text:#1E231F; --text2:#565E54;
          --accent:#477510; --accent2:#6A4FB8; --on-accent:#FFFFFF; --low-bg:#E6F5C0; --low-text:#365708;
          --yellow:#FFF1C9; --yellow-text:#5B4710; --error:#C9473F; --selected:#E2ECFB; --high-bg:#FDEEEE; --high-text:#8A2E2E;
          --ink:#23282F; --on-ink:#FFFFFF; --bright:#D4F25E; --on-bright:#1E231F;
          --shadow: 0 1px 2px rgba(22,33,58,.04), 0 10px 28px rgba(22,33,58,.07);
          --font: Poppins, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font-family: var(--font); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  /* ---------- the board: one white panel holding tinted tiles ---------- */
  .board { background: var(--surface); border: 1px solid var(--border); border-radius: 32px; padding: 22px 24px 24px;
           box-shadow: var(--shadow); display: grid; gap: 16px; }
  .bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .circles { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .ibtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
          color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
  .circles .ibtn + .ibtn { margin-left: -6px; }
  .ibtn:hover { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .source { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 4px; }
  .source .logo { width: 38px; height: 38px; border-radius: 50%; background: var(--bright); color: var(--on-bright); display: grid; place-items: center; }
  .source b { display: block; font-size: 13px; font-weight: 600; line-height: 1.2; }
  .source small { color: var(--text2); font-size: 11.5px; }
  .source .ghost { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 50%; color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .source .ghost:hover { background: var(--surface2); }
  .spacer { flex: 1; }
  .hello { display: flex; align-items: center; gap: 10px; }
  .hello b { display: block; font-weight: 600; font-size: 14px; }
  .hello small { color: var(--text2); font-size: 12px; }
  .datepill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px 5px 5px; font-size: 13.5px; font-weight: 500; }
  .datepill i { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-style: normal; }

  .title-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; padding: 6px 2px 4px; }
  .title { display: flex; align-items: center; gap: 14px; }
  .title h1 { margin: 0; line-height: 1; letter-spacing: -0.035em; }
  .title h1 span { display: block; font-weight: 300; font-size: clamp(22px, 3vw, 32px); color: var(--text2); margin-bottom: 4px; }
  .title h1 strong { display: block; font-weight: 600; font-size: clamp(32px, 4.6vw, 48px); }
  .mark { position: relative; width: 66px; height: 66px; border-radius: 50%; background: var(--bright); color: var(--on-bright); display: grid; place-items: center; flex: none; }
  .mark button { position: absolute; right: -14px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface);
                 background: var(--ink); color: var(--on-ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chipbox { display: inline-flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 999px; padding: 6px 16px 6px 6px; font-size: 13px; font-weight: 500; }
  .chipbox i { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-style: normal; }
  .cta { display: inline-flex; align-items: center; gap: 12px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 999px;
         padding: 6px 6px 6px 20px; font: 500 14px/1 var(--font); cursor: pointer; }
  .cta i { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); color: var(--text); display: grid; place-items: center; font-style: normal; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1100px) { .tile { padding: 14px; } .metric b, .now-head .v b, .cov b { font-size: 28px; } .avg .split b { font-size: 24px; } .avg .split > div { padding: 12px 14px; } .avg .top { padding: 14px; } }
  .col { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .tile { background: var(--surface2); border-radius: 24px; padding: 16px 18px; min-width: 0; position: relative; overflow: hidden; }
  .tile.flat { background: var(--surface); border: 1px solid var(--border); }
  .lbl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; }
  .lbl::before { content: ""; width: 16px; height: 16px; border-radius: 5px; background: var(--bright); flex: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .up { display: inline-flex; align-items: center; gap: 3px; background: var(--bright); color: var(--on-bright); border-radius: 999px;
        padding: 2px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .up.soft { background: var(--surface); color: var(--text); }
  .muted { color: var(--text2); font-size: 11.5px; line-height: 1.35; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s12 { grid-column: span 12; }

  /* A: period average */
  .avg { display: grid; grid-template-rows: auto 1fr auto; padding: 0; }
  .avg .top { padding: 16px 18px 12px; }
  .avg .big { font-size: clamp(36px, 4vw, 46px); font-weight: 500; line-height: 1; margin-top: 30px; }
  .avg .split { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
  .avg .split > div { padding: 14px 18px 16px; }
  .avg .split > div + div { border-left: 1px solid var(--border); }
  .avg .split b { display: block; font-size: 30px; font-weight: 500; line-height: 1.1; }

  /* B: carbon clock */
  .metrics { display: flex; flex-wrap: wrap; gap: 10px 34px; align-items: flex-end; margin: 10px 0 0; }
  .metric { display: flex; align-items: flex-end; gap: 10px; }
  .metric small { color: var(--text2); font-size: 12.5px; padding-bottom: 6px; }
  .metric b { font-size: 34px; font-weight: 500; line-height: 1; }
  .metric sup { font-size: 11px; font-weight: 500; vertical-align: top; margin-left: 2px; }
  .zoom { display: grid; gap: 4px; }
  .zoom button { width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; display: grid; place-items: center; }
  .zoom button[aria-pressed="true"] { background: var(--surface); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tabs button { font: 500 12.5px/1 var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--bright); border-color: var(--bright); color: var(--on-bright); }

  /* C: latest reading */
  .now-head { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; margin-top: 12px; }
  .now-head svg { width: 92px; height: 92px; border-radius: 16px; display: block; }
  .now-head .v { text-align: right; }
  .now-head .v b { font-size: 34px; font-weight: 500; line-height: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; margin-top: 8px; }
  .tags span { font-size: 10.5px; background: var(--surface); border-radius: 999px; padding: 2px 8px; }
  .tags .band { text-transform: capitalize; }
  .fuels { list-style: none; margin: 8px 0 0; padding: 0; }
  .fuels li { display: grid; grid-template-columns: 16px 46px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .fuels li:last-child { border-bottom: 0; }
  .fuels .box { width: 16px; height: 16px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; color: var(--on-ink); }
  .fuels .box.on { background: var(--ink); border-color: var(--ink); }
  .fuels .pct { font-size: 13.5px; font-weight: 500; }
  .fuels .name { overflow: hidden; text-overflow: ellipsis; }
  .fuels .name { color: var(--text2); text-transform: capitalize; }
  .more { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--text); font: 600 12px/1 var(--font); cursor: pointer; padding: 6px 0; }

  /* D: tip card with the glossy illustration */
  .tipcard { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; min-height: 238px; padding: 20px 0 20px 26px; }
  .tipcard h3 { font-size: clamp(19px, 2vw, 23px); font-weight: 500; line-height: 1.22; margin: 0 0 14px; letter-spacing: -0.01em; }
  .tipcard p { font-size: 12px; color: var(--text2); margin: 0 0 18px; max-width: 34ch; }
  .tipcard .acts { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .tipcard .small-cta { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 999px; padding: 8px 14px; font: 500 12px/1 var(--font); cursor: pointer; }
  .tipcard .link { border: 0; background: transparent; color: var(--text2); font: 500 12px/1 var(--font); cursor: pointer; padding: 6px 0; }
  .tipcard .link:hover { color: var(--text); }
  .tipcard > svg { width: 100%; height: auto; display: block; }

  /* E: status */
  .status h3 { font-size: 19px; font-weight: 500; margin: 0; line-height: 1.2; max-width: 14ch; }
  .status .side { text-align: right; font-size: 11.5px; color: var(--text2); max-width: 20ch; }
  .status .side b { color: var(--text); }
  .status .pillrow { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 999px; padding: 5px 5px 5px 5px; margin-top: 14px; font-size: 12px; }
  .status .pillrow .v { background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; white-space: nowrap; }
  .status .pillrow span { flex: 1; color: var(--text2); }
  .status .pillrow button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface); color: var(--text); cursor: pointer; display: grid; place-items: center; }

  /* F: lime zero-carbon card */
  .lime { background: var(--bright); color: var(--on-bright); display: grid; grid-template-columns: 1fr auto; min-height: 150px; padding: 14px 10px 14px 16px; }
  .lime .chip { display: inline-block; white-space: nowrap; background: var(--surface); color: var(--text); border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
  .lime .big { font-size: 30px; font-weight: 500; line-height: 1; }
  .lime .cap { font-size: 11.5px; font-weight: 500; }
  .lime svg { height: 128px; width: auto; align-self: end; }

  /* G: weekday lollipops */
  .lolli { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; height: 104px; margin-top: 8px; position: relative; }
  .lolli .c { display: grid; justify-items: center; gap: 6px; height: 100%; grid-template-rows: 1fr auto; }
  .lolli .track { position: relative; width: 4px; height: 100%; border-radius: 999px; background: var(--border); }
  .lolli .stem { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 30%, transparent); }
  .lolli .dot { position: absolute; left: 50%; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); transform: translate(-50%, 50%); }
  .lolli .dot.best { width: 16px; height: 16px; background: var(--bright); box-shadow: 0 0 0 3px var(--ink); }
  .lolli .flag { position: absolute; left: 50%; transform: translateX(-50%); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .lolli .d { font-size: 11px; color: var(--text2); }

  /* H: coverage */
  .cov { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: end; min-height: 150px; padding-bottom: 14px; }
  .cov svg { width: 76px; height: 120px; display: block; }
  .cov b { font-size: 34px; font-weight: 500; line-height: 1; }
  .cov b small { font-size: 15px; font-weight: 400; color: var(--text2); letter-spacing: 0; }
  .mini b { display: block; font-size: 28px; font-weight: 500; line-height: 1.1; margin-top: 12px; }
  .mini b small { font-size: 13px; font-weight: 400; color: var(--text2); }

  /* ---------- the explore section, below the board ---------- */
  .explore { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
  .explore-head { grid-column: span 12; padding: 4px 4px 0; }
  .explore-head h2 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .explore-head p { margin: 2px 0 0; color: var(--text2); font-size: 13.5px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
  .s7 { grid-column: span 7; } .s8 { grid-column: span 8; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; margin-bottom: 8px; }
  .head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .head p { margin: 2px 0 0; color: var(--text2); font-size: 12.5px; }
  .seg { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { font: 500 12.5px/1 var(--font); color: var(--text2); background: transparent; border: 0; border-radius: 999px; padding: 8px 13px; cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
  .chart { width: 100%; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--low-bg); color: var(--low-text); }
  .pill.demo { background: var(--high-bg); color: var(--high-text); }

  .daycycle { padding: 0; position: relative; overflow: hidden; }
  .daycycle svg { display: block; width: 100%; height: clamp(210px, 26vw, 270px); }
  .dc-read { position: absolute; top: 14px; left: 14px; background: color-mix(in srgb, var(--surface) 88%, transparent);
             backdrop-filter: blur(6px); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; min-width: 210px; }
  .dc-read .k { color: var(--text2); font-size: 11.5px; }
  .dc-read .t { font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .dc-read .v { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dc-read .v i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dc-bar { position: relative; height: 6px; border-radius: 999px; margin-top: 8px; }
  .dc-bar b { position: absolute; top: -3px; width: 4px; height: 12px; border-radius: 2px; background: var(--text); transform: translateX(-2px); }
  .dc-play { position: absolute; top: 14px; right: 14px; font: 600 12.5px/1 var(--font); color: var(--on-ink); cursor: pointer;
             background: var(--ink); border: 0; border-radius: 999px; padding: 10px 16px; }

  .mixwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 8px; align-items: center; }
  .mixlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .mixlist li { display: grid; grid-template-columns: 12px 70px 1fr 48px; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; }
  .mixlist li:hover, .mixlist li.on { background: var(--surface2); }
  .mixlist .dot { width: 10px; height: 10px; border-radius: 50%; }
  .mixlist .name { text-transform: capitalize; font-size: 13px; }
  .mixlist .bar { height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
  .mixlist .bar i { display: block; height: 100%; border-radius: 999px; width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
  .mixlist .pct { text-align: right; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .daytitle { font-size: 17px; font-weight: 600; margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .stat { background: var(--surface2); border-radius: 14px; padding: 8px 12px; min-width: 92px; }
  .stat b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text2); font-size: 11.5px; }
  .daygrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 8px; align-items: center; }
  .insights { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .insights li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 18px; background: var(--surface2); }
  .insights .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bright); color: var(--on-bright); }
  .insights b { display: block; font-weight: 600; font-size: 14px; }
  .insights span { color: var(--text2); font-size: 12.5px; }
  .note { color: var(--text2); font-size: 12px; margin: 6px 0 0; }
  .empty { padding: 40px; text-align: center; color: var(--text2); }

  /* One orchestrated entrance for the board; nothing else moves on its own except the illustrations. */
  .board { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  @media (max-width: 860px) {
    .grid > .s3, .grid > .s4 { grid-column: span 6; } .grid > .s6, .grid > .s5 { grid-column: span 12; }
    .s7, .s8 { grid-column: span 12; } .explore .s6 { grid-column: span 12; }
  }
  @media (max-width: 640px) {
    .board { padding: 16px; border-radius: 24px; }
    .grid > * { grid-column: span 12 !important; } .pair { grid-template-columns: 1fr; }
    .tipcard { grid-template-columns: 1fr; padding: 18px; } .tipcard > svg { max-width: 260px; margin: 6px auto 0; }
    .hello, .datepill { display: none; } .mixwrap, .daygrid { grid-template-columns: 1fr; }
    .dc-read { min-width: 0; padding: 8px 10px; } .dc-read .t { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) { .board { animation: none; } .mixlist .bar i { transition: none; } }
</style>
</head>
<body>
<main id="page"><div class="card empty">Loading…</div></main>
<script>
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const send = (type, extra = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
const charts = {};
let D = null, T = null, lastKey = "", state = { trend: "Both", band: true, clock: "All days", mix: "Average", day: null };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => v === null || v === undefined ? "–" : Number(v).toLocaleString("en-GB", { maximumFractionDigits: d, minimumFractionDigits: d });
const slotLabel = (i) => `${String(i >> 1).padStart(2, "0")}:${i & 1 ? "30" : "00"}`;
const prettyDay = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
const shortDay = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
const longDay = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
const SLOTS = Array.from({ length: 48 }, (_, i) => slotLabel(i));

// Measure the content itself; documentElement.scrollHeight never shrinks below the frame height.
function postHeight() {
  const page = document.getElementById("page");
  send("streamlit:setFrameHeight", { height: Math.ceil(page.getBoundingClientRect().bottom + window.scrollY) + 8 });
}
new ResizeObserver(() => { postHeight(); Object.values(charts).forEach((c) => c.resize()); }).observe(document.getElementById("page"));
window.addEventListener("message", (e) => {
  const msg = e.data;
  if (!msg || msg.type !== "streamlit:render") return;
  const data = msg.args && msg.args.data, key = JSON.stringify(data);
  if (key === lastKey) { postHeight(); return; }
  lastKey = key; D = data; build();
});
send("streamlit:componentReady", { apiVersion: 1 });

function applyTheme() {
  const r = document.documentElement.style, m = { bg: "--bg", surface: "--surface", surface2: "--surface2", border: "--border", text: "--text",

/* Carbon clock as capsule bars: ink bars, the cleanest one in lime with its value in a bubble. */
function drawBars() {
  const slots = D.clocks[view.day];
  let vals, labels;
  if (view.half) { vals = slots; labels = SLOTS; }
  else {
    vals = Array.from({ length: 24 }, (_, h) => { const p = [slots[2 * h], slots[2 * h + 1]].filter((v) => v !== null);
      return p.length ? p.reduce((a, b) => a + b, 0) / p.length : null; });
    labels = Array.from({ length: 24 }, (_, h) => `${String(h).padStart(2, "0")}:00`);
  }
  const ok = vals.filter((v) => v !== null);
  if (!ok.length) return;
  const lo = Math.min(...ok), hi = Math.max(...ok), best = vals.indexOf(lo), avg = ok.reduce((a, b) => a + b, 0) / ok.length;
  document.getElementById("bestTime").textContent = labels[best];
  document.getElementById("bestChip").textContent = `↓ ${fmt(((avg - lo) / avg) * 100)}% vs average`;
  chart("bars").setOption({ ...base(),
    grid: { left: 34, right: 4, top: 34, bottom: 22 },
    tooltip: { ...base().tooltip, trigger: "axis", axisPointer: { type: "none" },
      formatter: (ps) => `${ps[0].axisValue}: <b>${fmt(ps[0].data.value ?? ps[0].data)}</b> gCO₂/kWh` },
    xAxis: { type: "category", data: labels, axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: T.text2, fontSize: 10.5, interval: view.half ? 11 : 5 } },
    yAxis: { type: "value", min: Math.max(0, Math.floor(lo * 0.8 / 10) * 10), splitNumber: 2, axisLabel: { color: T.text2, fontSize: 10.5, showMinLabel: false },
      splitLine: { lineStyle: { color: T.border, type: "dashed" } } },
    series: [{ type: "bar", barWidth: view.half ? "62%" : "64%",
      data: vals.map((v, i) => ({ value: v, itemStyle: { color: i === best ? T.bright : T.ink, borderRadius: 999,
        borderColor: i === best ? T.ink : "transparent", borderWidth: i === best ? 1 : 0 },
        label: i === best ? { show: true, position: "top", distance: 8, formatter: () => `${fmt(lo)} g`, color: T.text, fontFamily: T.font,
          fontSize: 11, fontWeight: 600, backgroundColor: T.surface, borderColor: T.border, borderWidth: 1, borderRadius: 999, padding: [4, 8] } : { show: false } })),
      animationDelay: (i) => (REDUCE ? 0 : i * 18) }] }, { notMerge: true });
}

function drawAvgSpark() {
  const dd = D.daily, roll = dd.mean.map((_, i) => { const w = dd.mean.slice(Math.max(0, i - 6), i + 1).filter((v) => v !== null);
    return w.length ? Math.round(w.reduce((a, b) => a + b, 0) / w.length) : null; });
  chart("avgSpark").setOption({ ...base(), grid: { left: 14, right: 14, top: 6, bottom: 8 },
    tooltip: { ...base().tooltip, trigger: "axis", formatter: (ps) => `7 days to ${prettyDay(dd.dates[ps[0].dataIndex])}: <b>${fmt(ps[0].data)}</b> g` },
    xAxis: { type: "category", show: false, data: dd.dates, boundaryGap: false }, yAxis: { type: "value", show: false, scale: true },
    series: [{ type: "line", data: roll, showSymbol: false, smooth: 0.4, lineStyle: { width: 1.8, color: T.ink },
      markLine: { silent: true, symbol: "none", label: { show: false }, lineStyle: { color: T.text2, type: "dashed", width: 1 }, data: [{ type: "average" }] } }] });
}
/* Day of the week as lollipops: higher dot = more carbon-intensive; the cleanest day is lime. */
function drawLolli() {
  const w = D.weekdays, ok = w.mean.filter((v) => v !== null), el = document.getElementById("lolli");
  if (!ok.length) { el.innerHTML = '<p class="muted">No data</p>'; return; }
  const lo = Math.min(...ok), hi = Math.max(...ok), best = w.mean.indexOf(lo);
  document.getElementById("lolliBest").textContent = `${w.labels[best]} ${fmt(lo)} g`;
  el.innerHTML = w.labels.map((d, i) => { const v = w.mean[i];
    const h = v === null ? 0 : 18 + ((v - lo) / ((hi - lo) || 1)) * 72;
    return `<div class="c" role="listitem" aria-label="${d}: ${v === null ? "no data" : fmt(v) + " grams average over " + w.days[i] + " days"}${i === best ? ", cleanest" : ""}" title="${d}: ${fmt(v)} g (${w.days[i]} days)">
      <div class="track">${v === null ? "" : `<div class="stem" style="height:${h}%"></div><div class="dot ${i === best ? "best" : ""}" style="bottom:${h}%"></div>`}
</div>
      <span class="d">${d.slice(0, 1)}</span></div>`; }).join("");
}

function drawMix() {
  const area = document.getElementById("mixArea");
  if (charts.mix) { charts.mix.dispose(); delete charts.mix; }
  if (state.mix === "Average") {
    const entries = Object.entries(D.mix), max = Math.max(...entries.map((e) => e[1]));
    area.innerHTML = `<div class="mixwrap"><div id="mix" class="chart" style="height:250px" role="img" aria-label="Average generation mix"></div>
      <ul class="mixlist">${entries.map(([f, v], i) => `<li data-i="${i}"><span class="dot" style="background:${T.fuels[f] || T.text2}"></span>
        <span class="name">${esc(f)}</span><span class="bar"><i style="background:${T.fuels[f] || T.text2}" data-w="${(v / max) * 100}"></i></span>
        <span class="pct">${fmt(v, 1)}%</span></li>`).join("")}</ul></div>`;
    const c = chart("mix");
    c.setOption({ ...base(), tooltip: { ...base().tooltip, formatter: (p) => `${p.name}: <b>${fmt(p.value, 1)}%</b>` },
      series: [{ type: "pie", radius: ["56%", "84%"], center: ["50%", "50%"], padAngle: 2, itemStyle: { borderRadius: 8 }, avoidLabelOverlap: false,

        labelLine: { show: false },

        data: entries.map(([f, v]) => ({ name: f, value: v, itemStyle: { color: T.fuels[f] || T.text2 } })) }] }, { notMerge: true });
    requestAnimationFrame(() => area.querySelectorAll(".bar i").forEach((b) => (b.style.width = b.dataset.w + "%")));

        itemStyle: { color: T.fuels[f] || T.text2 }, emphasis: { focus: "series" } })) }, { notMerge: true });
  }

function drawTrend() {

    series.push({ name: "Range", type: "line", data: band, stack: "band", showSymbol: false, lineStyle: { opacity: 0 }, silent: true,
                  areaStyle: { color: T.accent + "1F" }, tooltip: { show: false } });
  }
  if (state.trend !== "Median") series.push({ name: "Mean", type: "line", data: dd.mean, showSymbol: false, smooth: 0.25,
    lineStyle: { width: 2.4, color: T.accent }, itemStyle: { color: T.accent },

  if (state.trend !== "Mean") series.push({ name: "Median", type: "line", data: dd.median, showSymbol: false, smooth: 0.25,
    lineStyle: { width: 1.8, color: T.accent2, type: state.trend === "Both" ? "dashed" : "solid" }, itemStyle: { color: T.accent2 } });

      selectedDataBackground: { lineStyle: { color: T.accent }, areaStyle: { color: T.accent + "40" } },
      handleStyle: { color: T.accent, borderColor: T.accent }, moveHandleStyle: { color: T.accent + "88" }, textStyle: { color: T.text2 },
      labelFormatter: (i) => shortDay(dd.dates[i] || "") }],

}
function drawCalendar() {
  const dd = D.daily, data = dd.dates.map((x, i) => [x, dd.mean[i]]).filter((r) => r[1] !== null);
  const vals = data.map((r) => r[1]), lo = Math.floor(Math.min(...vals)), hi = Math.ceil(Math.max(...vals));
  const c = chart("calendar");
  const sel = () => ({ name: "Selected", type: "effectScatter", coordinateSystem: "calendar", data: [[state.day, 1]], symbolSize: 13,
    rippleEffect: { scale: REDUCE ? 1 : 2.6, brushType: "stroke", period: 3, color: T.accent }, itemStyle: { color: "transparent", borderColor: T.accent, borderWidth: 2 },
    silent: true, zlevel: 2, tooltip: { show: false } });
  c.setOption({ ...base(),
    tooltip: { ...base().tooltip, formatter: (p) => p.seriesType === "heatmap" ? `<b>${prettyDay(p.data[0])}</b><br>Daily mean <b>${fmt(p.data[1])}</b> gCO₂/kWh<br><span style="color:${T.text2}">Click to open this day</span>` : "" },
    visualMap: { min: lo, max: hi, calculable: true, orient: "horizontal", left: "center", bottom: 0, itemWidth: 12, itemHeight: 180,
      inRange: { color: T.scale }, textStyle: { color: T.text2, fontSize: 11 }, seriesIndex: 0, formatter: (v) => `${Math.round(v)} g` },
    calendar: { range: [dd.dates[0], dd.dates[dd.dates.length - 1]], top: 26, left: 34, right: 10, cellSize: ["auto", 14],
      itemStyle: { color: T.surface2, borderColor: T.surface, borderWidth: 3, borderRadius: 3 }, splitLine: { show: false },
      dayLabel: { firstDay: 1, color: T.text2, fontSize: 10, nameMap: ["S", "M", "T", "W", "T", "F", "S"] },
      // Hide the label of a partial first or last month (a few days only), where it would collide with its neighbour.
      monthLabel: { color: T.text2, fontSize: 11, formatter: (p) => {
        const ym = `${p.yyyy}-${p.MM}`, first = dd.dates[0], last = dd.dates[dd.dates.length - 1];
        if (ym === first.slice(0, 7) && +first.slice(8) > 24) return "";
        if (ym === last.slice(0, 7) && +last.slice(8) < 8) return "";
        return p.nameMap; } }, yearLabel: { show: false } },
    series: [{ type: "heatmap", coordinateSystem: "calendar", data, emphasis: { itemStyle: { borderColor: T.text, borderWidth: 1.5 } } }, sel()] });
  c.on("click", (p) => { if (p.seriesType === "heatmap") { state.day = p.data[0]; c.setOption({ series: [{}, sel()] }); drawDay(state.day); } });
}
function drawDay(iso) {
  const day = D.days[iso]; if (!day) return;
  const s = day.slots, valid = s.map((v, i) => [v, i]).filter((r) => r[0] !== null);
  document.getElementById("dayTitle").textContent = prettyDay(iso);
  if (!valid.length) { document.getElementById("dayStats").innerHTML = ""; return; }
  const mean = valid.reduce((a, r) => a + r[0], 0) / valid.length;
  const mn = valid.reduce((a, r) => (r[0] < a[0] ? r : a)), mx = valid.reduce((a, r) => (r[0] > a[0] ? r : a));
  document.getElementById("dayStats").innerHTML =
    `<div class="stat"><b>${fmt(mean)}</b><span>day mean</span></div>` +
    `<div class="stat"><b style="color:${T.scale[0]}">${fmt(mn[0])}</b><span>low at ${slotLabel(mn[1])}</span></div>` +
    `<div class="stat"><b style="color:${T.scale[4]}">${fmt(mx[0])}</b><span>high at ${slotLabel(mx[1])}</span></div>`;
  const b = day.best2h;
  document.getElementById("dayNote").textContent = b === null || b === undefined ? "No complete 2-hour window on this day."
    : `Cleanest 2 hours this day: ${slotLabel(b)} to ${slotLabel((b + 4) % 48)} (highlighted). Times are UK wall-clock.`;
  const allVals = Object.values(D.days).flatMap((x) => x.slots).filter((v) => v !== null);
  chart("dayLine").setOption({ ...base(), grid: { left: 36, right: 8, top: 12, bottom: 24 },
    tooltip: { ...base().tooltip, trigger: "axis", formatter: (ps) => `${ps[0].axisValue}: <b>${fmt(ps[0].data)}</b> gCO₂/kWh` },
    xAxis: { type: "category", data: SLOTS, boundaryGap: false, ...axisCommon(), splitLine: { show: false }, axisLabel: { color: T.text2, fontSize: 10, interval: 11 } },
    yAxis: { type: "value", ...axisCommon(), min: (v) => Math.max(0, Math.floor(v.min * 0.9)) },
    visualMap: { show: false, seriesIndex: 0, dimension: 1, min: Math.min(...allVals), max: Math.max(...allVals), inRange: { color: T.scale } },
    series: [{ type: "line", data: s, smooth: 0.3, showSymbol: false, connectNulls: false, lineStyle: { width: 3 },
      areaStyle: { opacity: 0.12 },
      markArea: b === null || b === undefined ? undefined : { silent: true, itemStyle: { color: T.accent + "18", borderColor: T.accent, borderWidth: 1, borderType: "dashed" },
        data: [[{ xAxis: SLOTS[b] }, { xAxis: SLOTS[Math.min(b + 4, 47)] }]] } }] }, { notMerge: true });
  const mix = Object.entries(day.mix).sort((a, b2) => b2[1] - a[1]);
  chart("dayMix").setOption({ ...base(), tooltip: { ...base().tooltip, formatter: (p) => `${p.name}: <b>${fmt(p.value, 1)}%</b>` },
    series: [{ type: "pie", radius: ["52%", "80%"], center: ["50%", "50%"], padAngle: 2, itemStyle: { borderRadius: 4 }, avoidLabelOverlap: false,
      label: { show: true, position: "center", formatter: () => mix.length ? `{a|${mix[0][0]}}\n{b|${fmt(mix[0][1], 0)}%}` : "", rich: {
        a: { color: T.text2, fontSize: 11, fontFamily: T.font, textTransform: "capitalize" }, b: { color: T.text, fontSize: 18, fontWeight: 700, fontFamily: T.font } } },
      emphasis: { label: { show: true, formatter: (p) => `{a|${p.name}}\n{b|${fmt(p.value, 0)}%}` } }, labelLine: { show: false },
      data: mix.map(([f, v]) => ({ name: f, value: v, itemStyle: { color: T.fuels[f] || T.text2 } })) }] }, { notMerge: true });
}
function drawSankey() {
  const s = D.sankey, sub = document.getElementById("sankeySub");
  if (!s) { sub.textContent = "No pipeline run with extracted records is recorded yet."; return; }
  sub.textContent = `Intensity records in the latest data run (${s.started}, ${s.status}). Re-runs show up as updates, never duplicates.`;
  const color = { "Fetched from API": T.accent2, "Passed validation": T.accent, "Rejected and logged": T.error, "Exact duplicates": T.warn,
    "Loaded to DuckDB": T.accent, "New half-hours": T.fuels.hydro, "Updated existing": T.scale[1], "Outside range or merged": T.text2 };
  chart("sankey").setOption({ ...base(), tooltip: { ...base().tooltip, formatter: (p) => p.dataType === "edge"
      ? `${p.data.source} → ${p.data.target}: <b>${fmt(p.data.value)}</b>` : `${p.name}: <b>${fmt(p.value)}</b>` },
    series: [{ type: "sankey", left: 6, right: 190, top: 10, bottom: 10, nodeWidth: 14, nodeGap: 18, draggable: true, layoutIterations: 32,
      emphasis: { focus: "adjacency" }, lineStyle: { color: "gradient", curveness: 0.5, opacity: 0.28 },
      label: { color: T.text, fontFamily: T.font, fontSize: 12.5, formatter: (p) => `${p.name}  {v|${fmt(p.value)}}`, rich: { v: { color: T.text2, fontSize: 12 } } },
      data: s.nodes.map((n) => ({ ...n, itemStyle: { color: color[n.name] || T.text2, borderWidth: 0 } })), links: s.links }] });
}
